name: Deploy Hugo site to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: "0.125.7"
          extended: true

      - name: Setup GitHub Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Build site
        run: |
          hugo \
            --minify \
            --baseURL "${{ steps.pages.outputs.base_url }}/"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

      - name: Notify on failure (ntfy)
        if: failure()
        env:
          NTFY_URL: ${{ secrets.NTFY_URL }}
          NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}
        run: |
          if [ -z "$NTFY_URL" ]; then
            echo "NTFY_URL repo secret not set — skipping notification."
            exit 0
          fi
          curl -sf \
            -H "Authorization: Bearer $NTFY_TOKEN" \
            -H "Title: Deploy build failed" \
            -H "Priority: urgent" \
            -H "Tags: x,rotating_light" \
            -d "${{ github.repository }}@${{ github.ref_name }} (${{ github.sha }}) -- ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            "$NTFY_URL" || echo "ntfy notification failed to send"

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Notify on failure (ntfy)
        if: failure()
        env:
          NTFY_URL: ${{ secrets.NTFY_URL }}
          NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}
        run: |
          if [ -z "$NTFY_URL" ]; then
            echo "NTFY_URL repo secret not set — skipping notification."
            exit 0
          fi
          curl -sf \
            -H "Authorization: Bearer $NTFY_TOKEN" \
            -H "Title: Deploy to GitHub Pages failed" \
            -H "Priority: urgent" \
            -H "Tags: x,rotating_light" \
            -d "${{ github.repository }}@${{ github.ref_name }} (${{ github.sha }}) -- ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            "$NTFY_URL" || echo "ntfy notification failed to send"